name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust MSVC
        run: rustup toolchain install stable --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
      - name: Check tag version
        run: |
          $metadata = cargo +stable metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'frosthaven-lan').version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match Cargo.toml version' }
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test
        run: cargo +stable test --workspace --locked
      - name: Test managed runtime assembly readiness
        run: cargo +stable xtask test-managed
      - name: Build and verify portable ZIP
        run: cargo +stable xtask package
      - name: Prepare bilingual release notes
        run: |
          $zh = (Get-Content README.md -Raw -Encoding utf8) -split '\r?\n\r?\n', 2
          $en = (Get-Content README.en.md -Raw -Encoding utf8) -split '\r?\n\r?\n', 2
          $notes = $zh[0] + "`n`n" + $en[0] + "`n`nExtract the complete ZIP into a writable folder, then open the package folder. Double-click frosthaven-lan.exe for direct game startup, or right-click and select Run as administrator for Steam startup. Use administrator mode if you need the Steam in-game overlay. Requires Windows x64 and supported Frosthaven through Steam. Verify the ZIP using the attached SHA256 file.`n`n请完整解压 ZIP 到可写目录，打开包目录，双击 frosthaven-lan.exe 直接启动游戏；右键选择以管理员身份运行则通过 Steam 启动。如需开启 Steam 游戏内叠加界面，请以管理员模式启动工具。需要 Windows x64 和支持版本的 Steam 游戏。"
          Set-Content artifacts/release-notes.md -Value $notes -Encoding utf8
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem artifacts/*.zip, artifacts/*.sha256 | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Frosthaven LAN $env:RELEASE_TAG" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
