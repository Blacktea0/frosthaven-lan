[package]
name = "frosthaven-lan"
version = "0.3.1"
edition = "2021"
description = "Windows runtime LAN injector for Frosthaven"
readme = "README.md"
publish = false
[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "2"
[lib]
name = "lanbridge"
crate-type = ["cdylib"]
[[bin]]
name = "frosthaven-lan"
path = "src/main.rs"
[dependencies]
sha2 = "0.10"
